[package]
name = "tessora"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
m3u8-rs = "6"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
thiserror = "2"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
  "sync",
] }
topcoat = { version = "=0.10.0", default-features = false, features = [
  "asset",
  "discover",
  "icon-iconify",
  "router",
  "runtime",
  "serve",
  "tailwind",
  "ui",
  "view",
  "websocket",
] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }


[build-dependencies]
topcoat = { version = "=0.10.0", default-features = false, features = [
  "icon-iconify",
  "tailwind",
] }
