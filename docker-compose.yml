services:
  tessora:
    image: lemonc7/tessora
    container_name: tessora
    restart: unless-stopped
    init: true
    ports:
      - 3000:3000
    environment:
      - TZ=Asia/Shanghai
      - MAX_CONCURRENT_DOWNLOADS=2
      - CONCURRENT_FRAGMENTS=8
      - MEDIA_SETTLE_SECONDS=60
      - TEMP_ROOT=/data/temp
    volumes:
      - ./downloads:/data/downloads
    stop_grace_period: 30s
