name: tessora

services:
  tessora:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TESSORA_IMAGE:-tessora:local}
    container_name: tessora
    restart: unless-stopped
    init: true
    ports:
      - "${TESSORA_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      TZ: ${TZ:-Asia/Shanghai}
      RUST_LOG: ${RUST_LOG:-info}
      DOWNLOAD_ROOT: /data/downloads
      TEMP_ROOT: /data/downloads
      FFMPEG_BIN: /usr/bin/ffmpeg
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-2}
      CONCURRENT_FRAGMENTS: ${CONCURRENT_FRAGMENTS:-8}
      MEDIA_SETTLE_SECONDS: ${MEDIA_SETTLE_SECONDS:-60}
    volumes:
      - ./downloads:/data/downloads
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
